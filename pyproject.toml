[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brandkit-lab"
version = "1.0.0"
description = "Measure a brand source page into a frozen design kit, then restyle neutral landing skeletons without moving the DOM tree."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shuo Zhao" }]
keywords = ["design-tokens", "css", "branding", "static-site", "wcag", "dependency-free"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Code Generators",
]
# The runtime dependency list is deliberately empty: the standard library is the
# whole toolchain. pytest is a development-only extra.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/hc-xshh/brandkit-lab"
Source = "https://github.com/hc-xshh/brandkit-lab"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
